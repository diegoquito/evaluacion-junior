# Ambiente local de la evaluación. La contraseña es solo para este contenedor.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Evaluacion.2026!"
      TZ: "America/Guayaquil"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Evaluacion.2026!' -C -b -i /db/01-esquema.sql &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Evaluacion.2026!' -C -b -i /db/02-datos.sql &&
        echo 'Base de datos Cartera lista.'
    restart: "no"
